## If > 0, save a screenshot to BepInEx/shots every N seconds (for testing).
# Setting type: Single
# Default value: 0
AutoScreenshotSeconds = 0

[Fonts]

## Game font name = replacement (Aleo, Oregano, MaShanZheng). Unlisted fonts are left alone.
# Setting type: String
# Default value: GenJyuuGothicX-Normal=Aleo;MSJH=Aleo;Roboto-Regular=Aleo;LiberationSans=Aleo;Arial=Aleo;SourceHanSerifTC-Bold=Oregano;Kaiu=Aleo;CHAOZISHEFENGYUNFAN-2=MaShanZheng
