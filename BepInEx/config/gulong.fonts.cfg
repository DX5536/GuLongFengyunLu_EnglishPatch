## GameObject names (case-insensitive, contains) that always get Oregano: speaker names, titles, headings.
# Setting type: String
# Default value: LastName,FirstName,NameText,Title,TitleText,txtTitle,TitleName,Header
HeadingObjects = LastName,FirstName,NameText,Title,TitleText,txtTitle,TitleName,Header

## GameObject names that always get MaShanZheng (UI effects).
# Setting type: String
# Default value: 
EffectObjects = 

## Replacement for TextMeshPro fonts that are not in FontMap (original font stays as hanzi fallback). Empty = leave alone.
# Setting type: String
# Default value: Aleo
DefaultTmpFont = Aleo

[Layout]

## Shrink UGUI text that overflows its box instead of clipping/overlapping it.
# Setting type: Boolean
# Default value: true
BestFit = true

## Smallest best-fit size as a fraction of the original font size.
# Setting type: Single
# Default value: 0.45
MinScale = 0.45

## Comma-separated path substrings (lower-case) whose Text components are disabled; used for the stray third character of the loading label.
# Setting type: String
# Default value: uiloading(clone)/text (2)
HidePaths = uiloading(clone)/text (2)

